services:
  # ---- PostgreSQL for multi-tenant data ----
  qingclaws-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${QINGCLAWS_DB_NAME:-qingclaws}
      POSTGRES_USER: ${QINGCLAWS_DB_USER:-qingclaws}
      POSTGRES_PASSWORD: ${QINGCLAWS_DB_PASSWORD:-qingclaws_secret}
    volumes:
      - qingclaws-pgdata:/var/lib/postgresql/data
    ports:
      - "${QINGCLAWS_DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QINGCLAWS_DB_USER:-qingclaws}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qingclaws-gateway:
    image: ${QINGCLAWS_IMAGE:-qingclaws:local}
    depends_on:
      qingclaws-db:
        condition: service_healthy
    environment:
      HOME: /home/node
      TERM: xterm-256color
      QINGCLAWS_GATEWAY_TOKEN: ${QINGCLAWS_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      # Multi-tenant database
      QINGCLAWS_DB_URL: postgresql://${QINGCLAWS_DB_USER:-qingclaws}:${QINGCLAWS_DB_PASSWORD:-qingclaws_secret}@qingclaws-db:5432/${QINGCLAWS_DB_NAME:-qingclaws}
      QINGCLAWS_JWT_SECRET: ${QINGCLAWS_JWT_SECRET:-change-me-to-a-long-random-secret}
    volumes:
      - ${QINGCLAWS_CONFIG_DIR}:/home/node/.qingclaws
      - ${QINGCLAWS_WORKSPACE_DIR}:/home/node/.qingclaws/workspace
    ports:
      - "${QINGCLAWS_GATEWAY_PORT:-18789}:18789"
      - "${QINGCLAWS_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${QINGCLAWS_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  qingclaws-cli:
    image: ${QINGCLAWS_IMAGE:-qingclaws:local}
    network_mode: "service:qingclaws-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      QINGCLAWS_GATEWAY_TOKEN: ${QINGCLAWS_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
    volumes:
      - ${QINGCLAWS_CONFIG_DIR}:/home/node/.qingclaws
      - ${QINGCLAWS_WORKSPACE_DIR}:/home/node/.qingclaws/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - qingclaws-gateway

volumes:
  qingclaws-pgdata:
