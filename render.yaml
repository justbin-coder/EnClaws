services:
  - type: web
    name: qingclaws
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: QINGCLAWS_STATE_DIR
        value: /data/.qingclaws
      - key: QINGCLAWS_WORKSPACE_DIR
        value: /data/workspace
      - key: QINGCLAWS_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: qingclaws-data
      mountPath: /data
      sizeGB: 1
